services:
  - type: web
    name: wa-blast-server
    runtime: node
    plan: free
    rootDir: nodejs-project
    buildCommand: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
